# SAMAVETA build configuration.
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is enabled for developer builds, where it is a real speed-up on repeated runs.
# CI disables it explicitly: a stale entry can make a task report UP-TO-DATE and produce no reports
# or artifacts at all, which reads as "tests passed" while nothing was executed or built.
org.gradle.configuration-cache=true
# Gradle's own version, also stated in gradle/wrapper/gradle-wrapper.properties.
org.gradle.wrapper.version=8.9

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

kotlin.code.style=official
ksp.incremental=true
